name: CI/CD Pipeline - Node.js App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Test Job
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run tests and capture results
        run: |
          npm test > test-results.txt 2>&1 || true
          cat test-results.txt

      - name: Upload test results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.txt

  deploy:
    name: Deploy Job
    needs: test
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download test results artifact
        uses: actions/download-artifact@v4
        with:
          name: test-results

      - name: Display artifact content
        run: cat test-results.txt

      - name: Install dependencies
        run: npm install

      - name: Deploy application
        run: bash deploy.sh
